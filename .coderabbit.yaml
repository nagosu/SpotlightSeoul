# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit 리뷰 언어를 한국어로 고정합니다.
language: 'ko-KR'

# 리뷰 톤(말투/기준)을 프로젝트에 맞게 안내합니다.
tone_instructions: >
  리뷰는 정중하고 간결하게 한국어로 작성해 주세요.
  단순 스타일/취향보다 실제 버그, 보안, 예외처리, 경계값, 타입/런타임 안정성,
  성능 병목 가능성이 큰 부분을 우선해서 근거와 함께 지적해 주세요.

reviews:
  profile: 'chill'

  # 산출물/의존성/캐시 파일을 리뷰에서 제외해 노이즈를 줄입니다.
  # (glob 패턴, '!'로 시작하면 제외)
  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/dist-ssr/**'
    - '!**/build/**'
    - '!**/coverage/**'
    - '!**/.cache/**'
    - '!**/.nest/**'
    - '!**/logs/**'
    - '!**/*.log'
    - '!**/*.min.*'
    - '!**/package-lock.json'
    - '!**/pnpm-lock.yaml'
    - '!**/yarn.lock'

  # 불필요한 산출물(시/poem)을 끄고, 요약은 유지합니다.
  poem: false
  high_level_summary: true

  # 자동 리뷰는 켜되, 드래프트 PR은 제외합니다.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
