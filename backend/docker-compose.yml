services:
  mysql:
    image: mysql:8
    container_name: seoul-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seoul}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - seoul-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      target: prod
    container_name: seoul-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # 컨테이너 내부에서는 mysql 서비스명으로 접근
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pass}
      DB_SCHEMA: ${MYSQL_DATABASE:-seoul}
      TZ: Asia/Seoul
      # dev/prod 동작 제어 (기본값 유지 가능)
      OPEN_DATA_ENABLED: ${OPEN_DATA_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ACCESS_EXPIRES_MINUTES: ${JWT_ACCESS_EXPIRES_MINUTES:-30}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-30}
      AUTH_HEADER: ${AUTH_HEADER:-Authorization}
      # Seoul Open API
      SEOUL_OPEN_API_KEY: ${SEOUL_OPEN_API_KEY:-}
      SEOUL_OPEN_API_BASE_URL: ${SEOUL_OPEN_API_BASE_URL:-http://openapi.seoul.go.kr:8088}
      SEOUL_OPEN_API_DATASET: ${SEOUL_OPEN_API_DATASET:-culturalEventInfo}
      SEOUL_OPEN_API_CHUNK_SIZE: ${SEOUL_OPEN_API_CHUNK_SIZE:-999}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  seoul-mysql-data:
